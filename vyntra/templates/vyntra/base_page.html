<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232563EB%27/%3E%3Cstop offset=%271%27 stop-color=%27%235B5BF0%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%27100%27 height=%27100%27 rx=%2723%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M28 73 V45 L45 62 L72 27 V73%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%2711%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <title>{% block title %}{% endblock %} · Manaze</title>
  <style>
    :root { --text: #1f2937; --muted: #6b7280; --bg: #ffffff; --accent: #208aef; }
    @media (prefers-color-scheme: dark) { :root { --text: #e5e7eb; --muted: #9ca3af; --bg: #111827; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 28px; margin-bottom: 4px; }
    h2 { font-size: 19px; margin-top: 32px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    li { margin: 4px 0; }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--muted); display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
  </style>
</head>
<body><main>{% block content %}{% endblock %}
  <footer>
    <a href="/terms/">Terms &amp; Conditions</a>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/refunds/">Cancellation &amp; Refunds</a>
    <a href="/shipping/">Shipping &amp; Delivery</a>
    <a href="/contact/">Contact Us</a>
  </footer>
</main></body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Vyntra</title>
  <style>
    :root { --text: #1f2937; --muted: #6b7280; --bg: #ffffff; --accent: #208aef; }
    @media (prefers-color-scheme: dark) { :root { --text: #e5e7eb; --muted: #9ca3af; --bg: #111827; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 28px; margin-bottom: 4px; }
    h2 { font-size: 19px; margin-top: 32px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    li { margin: 4px 0; }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--muted); display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
  </style>
</head>
<body><main>{% block content %}{% endblock %}
  <footer>
    <a href="/terms/">Terms &amp; Conditions</a>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/refunds/">Cancellation &amp; Refunds</a>
    <a href="/shipping/">Shipping &amp; Delivery</a>
    <a href="/contact/">Contact Us</a>
  </footer>
</main></body>
</html>
